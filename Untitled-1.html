<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Croissant</title>
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Sweet Delights</title>

      <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
      />

      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      />

      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
      />

      <link rel="stylesheet" href="style.css" />
    </head>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: Georgia, serif;
        color: #4b2e1d;
        background: #fff4df;
      }
      main {
        max-width: 42rem;
        padding: 3rem;
        text-align: center;
        background: #fffaf2;
        border: 1px solid #edc98d;
        border-radius: 1.5rem;
        box-shadow: 0 1rem 3rem #8b5e2b22;
      }
      .croissant {
        font-size: 5rem;
        margin: 0;
      }
      h1 {
        margin: 0.5rem 0 1rem;
        font-size: clamp(2.5rem, 8vw, 4rem);
      }
      p {
        margin: 0 auto;
        max-width: 32rem;
        font-size: 1.2rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="croissant" aria-label="Croissant">🥐</p>
      <h1>Croissant</h1>
      <p>
        Buttery, flaky, and golden—an elegant little pastry made for slow
        mornings and good coffee.
      </p>
    </main>
  </body>
</html>
